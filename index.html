<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b87">
  <link rel="manifest" href="manifest.json">
<title>CLINI PET</title>
<style>
:root{--brand:#176b87;--brand2:#0d5268;--bg:#f4f8fa;--card:#fff;--text:#17252d;--muted:#71818a;--danger:#c0392b;--warn:#c88912;--ok:#27824a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px}
.brand{font-size:27px;font-weight:800;letter-spacing:1px}.subtitle{opacity:.85;margin-top:4px;font-size:13px}
main{max-width:900px;margin:auto;padding:16px 16px 88px}.screen{display:none}.screen.active{display:block}
h2{font-size:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 12px #102b3b12}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric b{font-size:27px;display:block;margin-top:5px}.metric span{color:var(--muted);font-size:12px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.quick button,.nav button{border:0;border-radius:14px;padding:14px;background:#fff;box-shadow:0 2px 8px #102b3b12;font-weight:700;color:var(--text)}
button{cursor:pointer}.primary{background:var(--brand)!important;color:white!important}
form{background:#fff;padding:16px;border-radius:16px;box-shadow:0 2px 10px #102b3b0e}.field{margin-bottom:10px}label{font-size:12px;font-weight:700;color:#42545e}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #d5e0e5;border-radius:9px;background:#fff}textarea{min-height:80px}
.list{display:grid;gap:10px;margin-top:12px}.row{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 8px #102b3b0c;display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#e7f3f6}.badge.warn{background:#fff1c7;color:#795b00}.badge.danger{background:#ffe0dc;color:#9c2419}.badge.ok{background:#def3e5;color:#196b39}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde6ea;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{box-shadow:none;background:transparent;padding:8px 3px;font-size:10px}.nav button.active{color:var(--brand);background:#e9f5f8}
.topline{display:flex;justify-content:space-between;align-items:center}.empty{text-align:center;color:var(--muted);padding:20px}.small{font-size:12px;color:var(--muted)}.danger{color:var(--danger)}.warn{color:var(--warn)}.ok{color:var(--ok)}
@media(min-width:650px){.cards{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="brand">🐾 CLINI PET</div><div class="subtitle">Veterinary Clinic Manager</div></header>
<main>
<section id="dashboard" class="screen active">
<div class="topline"><h2>Dashboard</h2><span class="small" id="today"></span></div>
<div class="cards">
<div class="card metric"><span>Total Pets</span><b id="petsCount">0</b></div>
<div class="card metric"><span>Due Soon</span><b id="dueCount">0</b></div>
<div class="card metric"><span>Overdue</span><b id="overdueCount">0</b></div>
<div class="card metric"><span>Appointments</span><b id="apptCount">0</b></div>
</div>
<div class="quick">
<button onclick="openForm('pet')">＋ Add Pet</button><button onclick="openForm('vaccine')">💉 Vaccine</button>
<button onclick="openForm('appointment')">📅 Appointment</button><button onclick="openForm('record')">🩺 Medical Record</button>
</div>
<div class="card"><div class="topline"><h3>🔔 Reminders</h3><span class="small">Next 7 days</span></div><div id="reminders"></div></div>
<div class="card" style="margin-top:12px"><h3>📅 Today</h3><div id="todayList"></div></div>
</section>

<section id="pets" class="screen"><div class="topline"><h2>Pets</h2><button class="primary" onclick="openForm('pet')">＋ Add</button></div><input placeholder="Search pet or owner..." oninput="renderPets(this.value)"><div id="petsList" class="list"></div></section>

<section id="vaccines" class="screen"><div class="topline"><h2>Vaccinations</h2><button class="primary" onclick="openForm('vaccine')">＋ Add</button></div><div id="vaccinesList" class="list"></div></section>

<section id="appointments" class="screen"><div class="topline"><h2>Appointments</h2><button class="primary" onclick="openForm('appointment')">＋ Add</button></div><div id="appointmentsList" class="list"></div></section>

<section id="more" class="screen"><h2>More</h2><div class="list">
<button class="card" onclick="show('owners')">👤 Owners</button>
<button class="card" onclick="show('records')">🩺 Medical Records</button>
<button class="card" onclick="backup()">💾 Export Backup</button>
<button class="card" onclick="resetData()">⚠ Reset Local Data</button>
</div></section>

<section id="owners" class="screen"><h2>Owners</h2><div id="ownersList" class="list"></div></section>
<section id="records" class="screen"><div class="topline"><h2>Medical Records</h2><button class="primary" onclick="openForm('record')">＋ Add</button></div><div id="recordsList" class="list"></div></section>
</main>

<nav class="nav">
<button class="active" onclick="show('dashboard',this)">🏠<br>Home</button>
<button onclick="show('pets',this)">🐾<br>Pets</button>
<button onclick="show('vaccines',this)">💉<br>Vaccines</button>
<button onclick="show('appointments',this)">📅<br>Visits</button>
<button onclick="show('more',this)">☰<br>More</button>
</nav>

<div id="modal" style="display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px;overflow:auto">
<div style="max-width:700px;margin:40px auto">
<div class="card"><div class="topline"><h2 id="modalTitle">Add</h2><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
</div></div>

<script>
const KEY='cliniPetV1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"pets":[],"vaccines":[],"appointments":[],"records":[]}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function show(id,btn){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');renderAll()
}
function petName(id){let p=db.pets.find(x=>x.id==id);return p?p.name:'Unknown'}
function today(){return new Date().toISOString().slice(0,10)}
function diffDays(d){let a=new Date();a.setHours(0,0,0,0);let b=new Date(d+'T00:00:00');return Math.round((b-a)/86400000)}
function badge(d){let x=diffDays(d);if(x<0)return '<span class="badge danger">OVERDUE</span>';if(x<=7)return '<span class="badge warn">DUE SOON</span>';return '<span class="badge ok">UPCOMING</span>'}
function openForm(type){
$('modal').style.display='block';
let pets=db.pets.map(p=>`<option value="${p.id}">${p.name} — ${p.owner}</option>`).join('');
let body='',title='';
if(type==='pet'){title='Add New Pet';body=`<form onsubmit="addPet(event)"><div class="grid">
<div class="field"><label>Pet Name<input id="fName" required></label></div><div class="field"><label>Owner Name<input id="fOwner" required></label></div><div class="field"><label>Phone<input id="fPhone"></label></div>
<div class="field"><label>Species<select id="fSpecies"><option>Dog</option><option>Cat</option><option>Horse</option><option>Rabbit</option><option>Turtle</option><option>Other</option></select></label></div><div class="field"><label>Breed<input id="fBreed"></label></div><div class="field"><label>Sex<select id="fSex"><option>Male</option><option>Female</option></select></label></div>
<div class="field"><label>Date of Birth<input id="fDob" type="date"></label></div><div class="field"><label>Weight (kg)<input id="fWeight" type="number" step=".01"></label></div></div><label>Notes<textarea id="fNotes"></textarea></label><button class="primary" type="submit">Save Pet</button></form>`}
if(type==='vaccine'){title='Add Vaccination';body=`<form onsubmit="addVaccine(event)"><div class="grid"><div class="field"><label>Pet<select id="fVPet" required>${pets}</select></label></div><div class="field"><label>Vaccine Name<input id="fVName" placeholder="Rabies / DHPP / FVRCP" required></label></div><div class="field"><label>Given Date<input id="fVDate" type="date" value="${today()}" required></label></div><div class="field"><label>Next Due Date<input id="fVNext" type="date" required></label></div></div><label>Notes<textarea id="fVNotes"></textarea></label><button class="primary" type="submit">Save Vaccination</button></form>`}
if(type==='appointment'){title='New Appointment';body=`<form onsubmit="addAppt(event)"><div class="grid"><div class="field"><label>Pet<select id="fAPet" required>${pets}</select></label></div><div class="field"><label>Date<input id="fADate" type="date" value="${today()}" required></label></div><div class="field"><label>Time<input id="fATime" type="time" required></label></div></div><label>Reason<input id="fAReason" placeholder="Check-up / Follow-up / Vaccination"></label><button class="primary" type="submit">Save Appointment</button></form>`}
if(type==='record'){title='Medical Record';body=`<form onsubmit="addRecord(event)"><div class="grid"><div class="field"><label>Pet<select id="fRPet" required>${pets}</select></label></div><div class="field"><label>Date<input id="fRDate" type="date" value="${today()}" required></label></div><div class="field"><label>Diagnosis<input id="fDiag"></label></div></div><label>Treatment<textarea id="fTreatment"></textarea></label><label>Notes<textarea id="fRNotes"></textarea></label><button class="primary" type="submit">Save Record</button></form>`}
$('modalTitle').textContent=title;$('modalBody').innerHTML=body
}
function closeModal(){$('modal').style.display='none'}
function addPet(e){e.preventDefault();db.pets.push({id:Date.now(),name:fName.value,owner:fOwner.value,phone:fPhone.value,species:fSpecies.value,breed:fBreed.value,sex:fSex.value,dob:fDob.value,weight:fWeight.value,notes:fNotes.value});closeModal();save()}
function addVaccine(e){e.preventDefault();db.vaccines.push({id:Date.now(),pet:fVPet.value,name:fVName.value,given:fVDate.value,next:fVNext.value,notes:fVNotes.value});closeModal();save()}
function addAppt(e){e.preventDefault();db.appointments.push({id:Date.now(),pet:fAPet.value,date:fADate.value,time:fATime.value,reason:fAReason.value});closeModal();save()}
function addRecord(e){e.preventDefault();db.records.push({id:Date.now(),pet:fRPet.value,date:fRDate.value,diagnosis:fDiag.value,treatment:fTreatment.value,notes:fRNotes.value});closeModal();save()}
function del(type,id){if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!=id);save()}}
function renderDashboard(){
$('petsCount').textContent=db.pets.length;
$('dueCount').textContent=db.vaccines.filter(v=>diffDays(v.next)>=0&&diffDays(v.next)<=7).length;
$('overdueCount').textContent=db.vaccines.filter(v=>diffDays(v.next)<0).length;
$('apptCount').textContent=db.appointments.filter(a=>a.date===today()).length;
$('today').textContent=new Date().toLocaleDateString();
let rem=db.vaccines.filter(v=>diffDays(v.next)<=7).sort((a,b)=>a.next.localeCompare(b.next));
$('reminders').innerHTML=rem.length?rem.map(v=>`<div class="row"><div><b>${petName(v.pet)}</b><div class="small">${v.name} • ${v.next}</div></div>${badge(v.next)}</div>`).join(''):'<div class="empty">No vaccination reminders.</div>';
let ap=db.appointments.filter(a=>a.date===today()).sort((a,b)=>a.time.localeCompare(b.time));
$('todayList').innerHTML=ap.length?ap.map(a=>`<div class="row"><div><b>${a.time}</b> — ${petName(a.pet)}</div><span class="small">${a.reason||''}</span></div>`).join(''):'<div class="empty">No appointments today.</div>'
}
function renderPets(q=''){q=q.toLowerCase();let rows=db.pets.filter(p=>(p.name+' '+p.owner+' '+p.phone).toLowerCase().includes(q));$('petsList').innerHTML=rows.length?rows.map(p=>`<div class="row"><div><b>🐾 ${p.name}</b><div class="small">${p.species} ${p.breed?'• '+p.breed:''} • Owner: ${p.owner}</div><div class="small">${p.phone||''} ${p.weight?'• '+p.weight+' kg':''}</div></div><button onclick="del('pets',${p.id})">Delete</button></div>`).join(''):'<div class="empty">No pets found.</div>'}
function renderVaccines(){$('vaccinesList').innerHTML=db.vaccines.slice().sort((a,b)=>a.next.localeCompare(b.next)).map(v=>`<div class="row"><div><b>${petName(v.pet)}</b><div class="small">${v.name} • Given ${v.given} • Next ${v.next}</div></div>${badge(v.next)}</div>`).join('')||'<div class="empty">No vaccinations.</div>'}
function renderAppts(){$('appointmentsList').innerHTML=db.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<div class="row"><div><b>${a.date} • ${a.time}</b><div class="small">${petName(a.pet)} • ${a.reason||''}</div></div><button onclick="del('appointments',${a.id})">Delete</button></div>`).join('')||'<div class="empty">No appointments.</div>'}
function renderOwners(){let map={};db.pets.forEach(p=>{map[p.owner]=map[p.owner]||{phone:p.phone,pets:[]};map[p.owner].pets.push(p.name)});$('ownersList').innerHTML=Object.entries(map).map(([o,x])=>`<div class="card"><b>👤 ${o}</b><div class="small">${x.phone||''}</div><p>${x.pets.join(' • ')}</p></div>`).join('')||'<div class="empty">No owners.</div>'}
function renderRecords(){$('recordsList').innerHTML=db.records.slice().reverse().map(r=>`<div class="card"><b>${petName(r.pet)} — ${r.date}</b><p><b>Diagnosis:</b> ${r.diagnosis||'-'}</p><p><b>Treatment:</b> ${r.treatment||'-'}</p><p class="small">${r.notes||''}</p></div>`).join('')||'<div class="empty">No medical records.</div>'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clini-pet-backup.json';a.click()}
function resetData(){if(confirm('Delete all local CLINI PET data?')){localStorage.removeItem(KEY);location.reload()}}
function renderAll(){renderDashboard();renderPets(document.querySelector('#pets input')?.value||'');renderVaccines();renderAppts();renderOwners();renderRecords()}
renderAll();
</script>
</body></html>
